name: Publish dist to the builds branch

# Pousse le build (patcher.js/preload.js/renderer.js/renderer.css) sur une
# branche dédiée ("builds") DU MÊME repo, plutôt que vers un repo externe —
# ça évite toute clé de déploiement : le GITHUB_TOKEN par défaut a déjà les
# droits d'écriture sur ce repo (voir `permissions` ci-dessous).
#
# ATTENTION : cette branche `builds` n'est PLUS ce qui est livré aux
# utilisateurs. La dist réellement injectée vient du repo jumeau
# `0ctane6/abyss`, dont la CI pousse vers `0ctane6/abyss-builds`, seul repo
# que le multitool « Skin Walker » télécharge. Ce workflow-ci ne sert donc
# plus que de copie de secours de notre côté.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build (standalone, updater interne désactivé)
        run: node --require=./scripts/suppressExperimentalWarnings.js scripts/build/build.mjs --standalone --disable-updater

      - name: Publier la dist sur la branche builds
        run: |
          mkdir -p /tmp/dist-out
          cp dist/desktop/patcher.js dist/desktop/preload.js dist/desktop/renderer.js dist/desktop/renderer.css /tmp/dist-out/

          git config user.name "abyss-ci"
          git config user.email "ci@abyss.local"

          git fetch origin builds:builds || true
          if git show-ref --verify --quiet refs/heads/builds; then
            git checkout builds
          else
            git checkout --orphan builds
            git rm -rf . > /dev/null 2>&1 || true
          fi

          cp /tmp/dist-out/* .
          git add patcher.js preload.js renderer.js renderer.css

          if git diff --cached --quiet; then
            echo "Dist inchangée, rien à publier."
          else
            git commit -m "Build dist depuis abyss-cord@${GITHUB_SHA::7}"
            git push origin builds
          fi
